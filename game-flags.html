    <meta charset="UTF-8" />

    <title>Угадай регион по флагу — Культурный атлас России</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f4f7fa;
        color: #243746;
        font-family: Arial, sans-serif;
      }

      .game-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 25px 20px 35px;
      }

      .game-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .game-header h1 {
        margin: 0 0 10px;
        color: #243746;
        font-size: 36px;
      }

      .game-header p {
        margin: 0;
        color: #315b70;
        font-size: 17px;
      }

      /* =========================
         FLAG
      ========================= */

      .flag-container {
        width: 100%;
        height: 420px;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 40px;

        background: #e8f0f4;
        border-radius: 18px;

        box-shadow: 0 4px 18px rgba(36, 55, 70, 0.08);
      }

      .flag {
        display: block;

        max-width: 85%;
        max-height: 280px;

        width: auto;
        height: auto;

        object-fit: contain;

        border-radius: 4px;

        box-shadow: 0 4px 15px rgba(36, 55, 70, 0.12);
      }

      /* =========================
         ANSWERS
      ========================= */

      .answers {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;

        max-width: 700px;

        margin: 25px auto 0;
      }

      .answer-button {
        border: none;
        border-radius: 12px;

        padding: 16px 20px;

        background: #e8f0f4;
        color: #243746;

        font-size: 16px;

        cursor: pointer;

        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .answer-button:hover {
        background: #d5e4eb;
        transform: translateY(-1px);
      }

      .answer-button.correct {
        background: #cfe6d5;
      }

      .answer-button.wrong {
        background: #efd1d1;
      }

      .answer-button:disabled {
        cursor: default;
      }

      .answer-button:disabled:hover {
        transform: none;
      }

      /* =========================
         RESULT
      ========================= */

      .result {
        min-height: 30px;

        margin-top: 20px;

        text-align: center;

        font-size: 18px;
        font-weight: 600;
      }

      /* =========================
         NEXT BUTTON
      ========================= */

      .next-button {
        display: block;

        margin: 15px auto 0;

        padding: 12px 24px;

        border: none;
        border-radius: 12px;

        background: #315b70;
        color: #ffffff;

        font-size: 16px;

        cursor: pointer;

        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .next-button:hover {
        background: #243746;
        transform: translateY(-1px);
      }

      /* =========================
         SCORE
      ========================= */

      .score {
        text-align: center;

        margin-top: 20px;

        color: #315b70;

        font-size: 16px;
      }

      /* =========================
         MOBILE
      ========================= */

      @media (max-width: 700px) {
        .game-container {
          padding: 20px 12px 30px;
        }

        .game-header {
          margin-bottom: 20px;
        }

        .game-header h1 {
          font-size: 27px;
        }

        .game-header p {
          font-size: 15px;
        }

        .flag-container {
          height: 420px;
          padding: 25px 15px;
        }

        .flag {
          max-width: 92%;
          max-height: 250px;
        }

        .answers {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;

          margin-top: 18px;
        }

        .answer-button {
          padding: 12px 10px;

          font-size: 14px;

          min-height: 48px;
        }

        .result {
          margin-top: 14px;
          font-size: 16px;
        }

        .next-button {
          margin-top: 12px;

          padding: 10px 20px;

          font-size: 15px;
        }

        .score {
          margin-top: 14px;
          font-size: 15px;
        }
      }
    </style>

        <button class="answer-button">Вариант 4</button>
      </div>

      <div class="result"></div>

      <button class="next-button">Следующий регион →</button>

      <div class="score">Счёт: 0</div>
    </main>

        "Ямало-Ненецкий АО":
          "https://commons.wikimedia.org/wiki/Special:Redirect/file/Flag_of_Yamalo-Nenets_Autonomous_Okrug.svg",

      /* =========================
         GAME ELEMENTS
      ========================= */

      const flagElement = document.querySelector(".flag");

      const answerButtons = document.querySelectorAll(".answer-button");

      const resultElement = document.querySelector(".result");

      const nextButton = document.querySelector(".next-button");

      const scoreElement = document.querySelector(".score");

      const regions = Object.keys(regionFlags);

      let currentRegion = null;
      let score = 0;
      let answered = false;

      /* =========================
         SHUFFLE
      ========================= */

      function shuffle(array) {
        const shuffled = [...array];

        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));

          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }

        return shuffled;
      }

      /* =========================
         NEW ROUND
      ========================= */

      function startNewRound() {
        answered = false;

        resultElement.textContent = "";

        answerButtons.forEach((button) => {
          button.disabled = false;

          button.classList.remove("correct", "wrong");
        });

        currentRegion = regions[Math.floor(Math.random() * regions.length)];

        flagElement.src = regionFlags[currentRegion];

        flagElement.alt = "Флаг региона";

        const otherRegions = regions.filter(
          (region) => region !== currentRegion,
        );

        const wrongAnswers = shuffle(otherRegions).slice(0, 3);

        const allAnswers = shuffle([currentRegion, ...wrongAnswers]);

        answerButtons.forEach((button, index) => {
          button.textContent = allAnswers[index];

          button.dataset.answer = allAnswers[index];
        });
      }

      /* =========================
         ANSWER CHECK
      ========================= */

      answerButtons.forEach((button) => {
        button.addEventListener("click", () => {
          if (answered || !currentRegion) {
            return;
          }

          answered = true;

          const selectedAnswer = button.dataset.answer;

          answerButtons.forEach((answerButton) => {
            answerButton.disabled = true;
          });

          if (selectedAnswer === currentRegion) {
            button.classList.add("correct");

            score++;

            resultElement.textContent = "Правильно! 🎉";
          } else {
            button.classList.add("wrong");

            answerButtons.forEach((answerButton) => {
              if (answerButton.dataset.answer === currentRegion) {
                answerButton.classList.add("correct");
              }
            });

            resultElement.textContent =
              "Неправильно. Правильный ответ: " + currentRegion;
          }

          scoreElement.textContent = "Счёт: " + score;
        });
      });

      /* =========================
         NEXT REGION
      ========================= */

      nextButton.addEventListener("click", () => {
        startNewRound();
      });

      /* =========================
         START GAME
      ========================= */

      startNewRound();
